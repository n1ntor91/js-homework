<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Slider</title>
</head>
<style>

    main {
        background-color: #F9F0E8;
        max-width: 10000px;
        padding: 20px;
    }

  .slidecontainer {
      width: 50%;
  }

  .slider {
      -webkit-appearance: none;
      width: 100%;
      height: 12.5px;
      background: #D3D3D3;
      outline: none;
      opacity: 0.8;
      -webkit-transition: .2s;
      transition: opacity .2s;
  }

  .slider:hover {
      opacity: 1;
  }

  .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: #1E90FF;

  }

  .slider::-moz-range-thumb {
      width: 25px;
      height: 25px;
      background: #4CAF50;
  }

</style>

<body>
<main>
<div>
  <input type="range" min="0" max="100" value="50" class="slider" id="slider">
</div>
</main>
</body>


</html>
